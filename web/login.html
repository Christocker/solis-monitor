<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f7">
    <meta name="robots" content="noindex">
    <title>Unlock — Solis Monitor</title>
    <script>(function(){try{var s=localStorage.getItem("theme");var d=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=s||(d?"dark":"light");}catch(e){}})();</script>
    <link rel="stylesheet" href="css/style.css?v=20261115c">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                </div>
                <div>
                    <strong>Solis Monitor</strong>
                    <span>S6-EH1P6K-L-PLUS</span>
                </div>
            </div>

            <h1 id="login-title">Enter PIN</h1>
            <p class="login-note">This dashboard is private. Enter the 6-digit PIN shared with you.</p>

            <form id="login-form" novalidate>
                <label class="sr-only" for="pin">6-digit PIN</label>
                <input id="pin" class="login-pin" type="password" inputmode="numeric"
                       pattern="[0-9]*" maxlength="6" autocomplete="one-time-code"
                       placeholder="••••••" autofocus required>
                <button id="login-btn" class="login-submit" type="submit">Unlock</button>
                <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="config.js?v=20261115c"></script>
    <script src="js/auth.js?v=20261115c"></script>
    <script>
        (function () {
            const form = document.getElementById("login-form");
            const input = document.getElementById("pin");
            const button = document.getElementById("login-btn");
            const error = document.getElementById("login-error");

            function safeNext() {
                const raw = new URLSearchParams(location.search).get("next");
                if (!raw || raw.charAt(0) !== "/" || raw.charAt(1) === "/") {
                    return "index.html";
                }
                return raw;
            }

            function setError(message) {
                error.textContent = message || "";
            }

            function setBusy(busy) {
                button.disabled = busy;
                input.disabled = busy;
                button.textContent = busy ? "Checking…" : "Unlock";
            }

            input.addEventListener("input", () => {
                input.value = input.value.replace(/\D/g, "").slice(0, 6);
                setError("");
            });

            form.addEventListener("submit", async (ev) => {
                ev.preventDefault();
                const pin = input.value.replace(/\D/g, "");
                if (pin.length !== 6) {
                    setError("Enter the 6-digit PIN.");
                    input.focus();
                    return;
                }
                setBusy(true);
                setError("");
                try {
                    await authLogin(pin);
                    location.replace(safeNext());
                } catch (err) {
                    setError(err.message || "Sign in failed.");
                    input.value = "";
                    input.focus();
                    setBusy(false);
                }
            });

            (async () => {
                try {
                    if (await authHasSession()) {
                        location.replace(safeNext());
                        return;
                    }
                } catch (e) { /* fall through to the form */ }
                input.focus();
            })();
        })();
    </script>
</body>
</html>
